services:
  postgres_db:
    image: postgres:15-alpine
    container_name: stratcom_pg
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: media_monitoring
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
